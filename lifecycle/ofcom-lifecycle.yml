  scheme: none-in-path
  current: '1.0'
  api_revision: '1'
  docs: null
  evidence:
    - source: https://api.ofcom.org.uk/mapi/apis?api-version=2021-08-01
      finding: 'apiRevision: "1", isCurrent: true for both APIs'
    - source: openapi/ofcom-connected-nations-broadband-api-openapi.yml
      finding: 'info.version: "1.0"; servers[0].url has no version segment'
  note: >-
    Azure APIM supports versions and revisions natively; Ofcom uses a single
    revision and no version set, so there is no side-by-side version surface.

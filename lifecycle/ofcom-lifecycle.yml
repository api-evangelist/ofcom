description: |
  Ofcom publishes no versioning policy, no deprecation policy, no SLA and no status
  page for its APIs. What version signal exists comes from the platform, not from a
  published policy: both APIs report Azure API Management apiRevision "1" and
  info.version "1.0", and neither base path carries a version segment
  (/broadband, /mobile). Consumers have no announced contract for breaking change.

notes:
  - >-
    Verbatim product description, Broadband Coverage (Basic): "Subscribers can
    retrieve broadband coverage data against postcodes up to run 100 calls/minute
    for 50,000 requests per month."
  - >-
    The Mobile Coverage (Premium) product description says "broadband coverage
    data" — an apparent copy/paste in Ofcom's own catalog. The numeric limits are
    recorded as published.

description: >-
  Ofcom publishes its rate limits directly in the Azure API Management product
  descriptions, which are readable anonymously. Each of the two APIs has a Basic and
  a Premium product; limits are enforced per subscription key, and a key is issued
  per product only after Ofcom approval. Ofcom documents no rate-limit response
  headers and no throttled-response contract.
sources:
  - https://api.ofcom.org.uk/products
  - https://api.ofcom.org.uk/mapi/products?api-version=2021-08-01
headers: {}
responseCodes:
  throttled: null

name: Ofcom
kind: company
description: Ofcom is the Office of Communications, the United Kingdom's independent
  regulator and competition authority for telecommunications, spectrum, broadcasting,
  post, and online safety. It licenses UK spectrum, administers the national numbering
  plan, publishes the Connected Nations reports on fixed and mobile coverage, and
  supervises the operators (EE, VMO2, Vodafone, Three) rather than selling connectivity
  itself. Its position in the telecom value chain is therefore upstream of the market
  it measures — it is a data producer and rule-setter, not a network or a CPaaS
  aggregator. Its API posture is unusually good for a regulator and unusually narrow
  in scope. Ofcom runs a real, Ofcom-branded Azure API Management developer portal
  at api.ofcom.org.uk with open sign-up, an interactive console, published rate-limit
  tiers, and anonymously downloadable OpenAPI 3.0.1 documents for two APIs — the
  Connected Nations Broadband API and the Connected Nations Mobile API — both served
  from the live gateway at api-proxy.ofcom.org.uk and authenticated with an Azure
  APIM subscription key. Everything else Ofcom publishes (spectrum licence registers,
  numbering data, market research) is documents and datasets, not APIs, and the
  community has repeatedly built third-party APIs on top of those files. Ofcom
  appears once in the CAMARA project participant register but exposes no CAMARA
  network APIs and is not a GSMA Open Gateway participant — Open Gateway is an
  operator commitment programme and Ofcom is the regulator, not an operator.
